<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineSync — Watch together. Wherever you are.</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="wrap" style="max-width:520px;padding-top:12vh">
  <div class="brand" style="font-size:34px;margin-bottom:6px">Cine<span>Sync</span></div>
  <p class="dim" style="margin-bottom:28px">Watch together. Wherever you are.</p>
  <div class="card">
    <h2 style="font-size:19px;margin-bottom:4px">Join CineSync</h2>
    <p class="dim sm">Your camera and mic are only used after you grant permission.</p>
    <div id="dev" style="margin-top:18px"></div>
    <p id="err" class="sm" style="color:#ff7a90;margin-top:12px"></p>
  </div>
</div>
<script>
(async () => {
  const me = await (await fetch('/api/me')).json();
  if (me.user) return location.href = '/dashboard';
  dev.innerHTML = `<p class="sm dim" style="margin-bottom:8px">Enter your name to join:</p>
    <input id="n" placeholder="Your name" maxlength="40" onkeydown="if(event.key==='Enter') devLogin()">
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="devLogin()">Join</button>`;
  if (new URLSearchParams(location.search).get('error')) err.textContent = 'Unable to join. Please try again.';
})();
async function devLogin(){
  const name = n.value.trim();
  if (!name) return err.textContent = 'Please enter your name.';
  const r = await fetch('/auth/dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});
  const d = await r.json().catch(() => ({}));
  if (r.ok) location.href='/dashboard'; else err.textContent = d.error || 'Unable to join.';
}
</script></body></html>
